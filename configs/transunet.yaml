# TransUNet - CNN + ViT hybrid (R50-ViT-B_16). Inherits base.yaml, sets only the model.
extends: base.yaml

model:
  name: transunet
  in_channels: 3
  out_channels: 1
  img_size: 224
  vit_name: R50-ViT-B_16
  pretrained: weights/imagenet21k/R50+ViT-B_16.npz  # downloaded by scripts/download_weights.py
